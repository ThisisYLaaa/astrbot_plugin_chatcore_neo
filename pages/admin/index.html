<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatCore Neo · 心核观测站</title>
<style>
/* ────────────────────────────────────────────────
   NEO 心核观测站
   设计方向：深夜仪器舱 —— 磷光青 × 冰蓝，等宽数字仪表
   布局：侧栏导航 + 单一滚动主区（根治旧版双层 sticky 错位）
   ──────────────────────────────────────────────── */
:root{
  --bg0:#060a13; --bg1:#0a101d;
  --panel:rgba(16,23,40,.66); --panel2:rgba(22,31,52,.5);
  --line:rgba(136,160,208,.14); --line2:rgba(136,160,208,.28);
  --fg:#eef2fb; --fg2:#c2cee6; --fg3:#93a3c4;
  --acc:#64f0c8; --acc2:#7dd3fc; --accink:#04241c;
  --ok:#6ee7a0; --warn:#ffc857; --bad:#ff6b81;
  --person:#6ee7a0; --topic:#64f0c8; --fact:#ffc857; --summary:#b48cff;
  --mono:"Cascadia Code","JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --grad:linear-gradient(120deg,#64f0c8,#7dd3fc);
  --shadow:0 12px 36px rgba(2,6,18,.5);
  --r:14px; --r2:10px; --sp:16px;
}
*{box-sizing:border-box}
html,body{height:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg0); color:var(--fg);
  font:13.5px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
::selection{background:rgba(100,240,200,.28)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(125,211,252,.16);border-radius:8px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(125,211,252,.34);background-clip:content-box;border:3px solid transparent}
*::-webkit-scrollbar-track{background:transparent}
a{color:var(--acc2)}
code,pre,.mono{font-family:var(--mono)}

/* ── 背景氛围：星尘点阵 + 双极光缓慢漂移 ── */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx .grid{
  position:absolute;inset:0;
  background-image:radial-gradient(rgba(140,170,230,.10) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(ellipse 90% 80% at 50% 0%,#000 0%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 0%,#000 0%,transparent 78%);
}
.bgfx .b1,.bgfx .b2{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.bgfx .b1{width:52vw;height:52vw;left:-14vw;top:-18vw;background:radial-gradient(circle,rgba(100,240,200,.16),transparent 65%);animation:drift1 44s ease-in-out infinite}
.bgfx .b2{width:46vw;height:46vw;right:-12vw;bottom:-16vw;background:radial-gradient(circle,rgba(125,211,252,.14),transparent 65%);animation:drift2 52s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,7vw) scale(1.18)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8vw,-6vw) scale(1.12)}}

/* ── 应用外壳：侧栏 + 主区（单一滚动容器，无跨层 sticky）── */
#app{position:relative;z-index:1;display:grid;grid-template-columns:238px minmax(0,1fr);height:100vh;height:100dvh}
#side{
  display:flex;flex-direction:column;min-height:0;
  background:rgba(8,12,22,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.brand .logo{width:42px;height:42px;flex:none;filter:drop-shadow(0 0 10px rgba(100,240,200,.35))}
.brand .orbit{transform-origin:22px 22px;animation:orbit 16s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.brand .bt b{display:block;font-size:15px;letter-spacing:.4px;font-weight:700}
.brand .bt b em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .bt span{display:block;font-family:var(--mono);font-size:10px;color:var(--fg3);letter-spacing:2.5px;margin-top:1px}
.side-foot{padding:12px 16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.side-foot .stat{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--fg3)}
.side-foot .stat b{font-family:var(--mono);color:var(--fg);font-size:12.5px;font-weight:600}
.side-foot .stat .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px rgba(100,240,200,.8);animation:pulse 2.4s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

#tabs{display:flex;flex-direction:column;gap:3px;padding:6px 10px;overflow:auto;flex:1;min-height:0}
#tabs button{
  display:flex;align-items:center;gap:10px;justify-content:flex-start;
  padding:8px 12px;border-radius:10px;border:1px solid transparent;
  background:transparent;color:var(--fg2);cursor:pointer;font:inherit;font-size:13px;
  transition:background .18s,color .18s,transform .18s,border-color .18s;
  position:relative;text-align:left;flex:none;
}
#tabs button .ix{font-family:var(--mono);font-size:10px;color:var(--fg3);width:17px;flex:none;transition:color .18s}
#tabs button:hover{background:rgba(125,211,252,.07);color:var(--fg);transform:translateX(3px)}
#tabs button.on{
  background:linear-gradient(90deg,rgba(100,240,200,.13),rgba(125,211,252,.04));
  color:var(--fg);border-color:rgba(100,240,200,.22);
}
#tabs button.on::before{
  content:"";position:absolute;left:-10px;top:22%;bottom:22%;width:3px;border-radius:3px;
  background:var(--grad);box-shadow:0 0 12px rgba(100,240,200,.65);
}
#tabs button.on .ix{color:var(--acc)}

#main{overflow:auto;min-width:0;display:flex;flex-direction:column;position:relative}
#busybar{position:fixed;top:0;left:0;right:0;height:2px;z-index:99;overflow:hidden;opacity:0;transition:opacity .3s;pointer-events:none}
#busybar.on{opacity:1}
#busybar::after{content:"";position:absolute;top:0;bottom:0;width:34%;background:var(--grad);border-radius:2px;box-shadow:0 0 10px rgba(100,240,200,.8);animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{0%{left:-34%}100%{left:100%}}

#topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:15px 28px;background:rgba(6,10,19,.74);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
#topbar .tt{min-width:0;flex:1}
#pageTitle{margin:0;font-size:19px;font-weight:700;letter-spacing:.4px;display:flex;align-items:baseline;gap:10px}
#pageTitle .ix{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--acc);letter-spacing:1px}
#pageDesc{margin:2px 0 0;color:var(--fg3);font-size:12px;line-height:1.5}
#topbar .actions{display:flex;gap:9px;flex:none}

#content{padding:22px 28px 72px;max-width:1560px;width:100%;margin:0 auto;flex:1}
#content section{display:none}
#content section.on{display:block;animation:secIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes secIn{from{opacity:0;transform:translateY(10px)}}

/* ── 卡片：玻璃拟态 + 交错入场 ── */
.card{
  position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:var(--sp);overflow:hidden;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:var(--shadow);
  animation:rise .55s cubic-bezier(.22,1,.36,1) both;
  transition:border-color .25s;
}
.card:hover{border-color:var(--line2)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
section.on .card:nth-child(1){animation-delay:.03s}
section.on .card:nth-child(2){animation-delay:.09s}
section.on .card:nth-child(3){animation-delay:.15s}
section.on .card:nth-child(4){animation-delay:.21s}
section.on .card:nth-child(5){animation-delay:.27s}
section.on .card:nth-child(6){animation-delay:.33s}
section.on .card:nth-child(7){animation-delay:.39s}
section.on .card:nth-child(8){animation-delay:.45s}
.card > h2{
  margin:0;padding:13px 18px;font-size:12.5px;font-weight:600;letter-spacing:.4px;
  background:rgba(125,211,252,.045);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.card > h2::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--grad);box-shadow:0 0 8px rgba(100,240,200,.5);flex:none;transform:rotate(45deg)}
.card > h2 .spacer{flex:1}
.card > h2 .hint{color:var(--fg3);font-size:12px;font-weight:400;flex:1;min-width:120px;line-height:1.5}
.card .body{padding:16px 18px}
.card .body.tight{padding:0}
.hint{color:var(--fg3);font-size:12.5px;font-weight:400;line-height:1.6}
.empty{color:var(--fg3);text-align:center;padding:30px 16px;font-size:13px}

/* ── 仪表数字砖 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.kv{
  position:relative;background:rgba(12,18,32,.55);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;overflow:hidden;
  transition:border-color .22s,transform .22s;
}
.kv::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;
  background:linear-gradient(120deg,rgba(100,240,200,.07),transparent 42%);opacity:0;transition:opacity .22s}
.kv:hover{border-color:rgba(100,240,200,.32);transform:translateY(-2px)}
.kv:hover::after{opacity:1}
.kv .k{font-family:var(--mono);font-size:10.5px;color:var(--fg3);letter-spacing:.8px}
.kv .v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:4px;word-break:break-all;font-variant-numeric:tabular-nums}
.kv .v.sm{font-size:12.5px;font-weight:500}

/* ── 按钮 ── */
button{
  font:inherit;cursor:pointer;color:var(--fg);
  background:rgba(125,160,220,.08);border:1px solid var(--line2);
  padding:6px 14px;border-radius:10px;transition:.16s;
  display:inline-flex;align-items:center;gap:6px;font-size:12.8px;
}
button:hover:not(:disabled){background:rgba(125,211,252,.13);border-color:rgba(125,211,252,.45);transform:translateY(-1px);box-shadow:0 4px 14px rgba(4,10,24,.4)}
button:active:not(:disabled){transform:translateY(0)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{
  background:var(--grad);border:none;color:var(--accink);font-weight:700;
  box-shadow:0 4px 16px rgba(100,240,200,.24);
}
button.primary:hover:not(:disabled){box-shadow:0 6px 22px rgba(100,240,200,.38);filter:brightness(1.06)}
button.danger{color:var(--bad);border-color:rgba(255,107,129,.4);background:rgba(255,107,129,.06)}
button.danger:hover:not(:disabled){background:rgba(255,107,129,.13);border-color:rgba(255,107,129,.65);box-shadow:0 4px 14px rgba(120,10,30,.35)}
button.busy{position:relative;color:transparent!important}
button.busy::after{
  content:"";position:absolute;inset:0;margin:auto;width:13px;height:13px;
  border:2px solid rgba(232,237,247,.85);border-top-color:transparent;border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:11.5px;background:rgba(125,211,252,.07);border:1px solid var(--line);color:var(--fg2);
}
.pill.on{color:var(--ok);border-color:rgba(110,231,160,.35);background:rgba(110,231,160,.07)}
.pill.on::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px rgba(110,231,160,.9);animation:pulse 2.2s ease-in-out infinite}
.pill.off{color:var(--fg3)}
.pill b{color:var(--fg);font-weight:600}

/* ── 表格 ── */
table{width:100%;border-collapse:collapse;font-size:12.8px}
th,td{padding:8px 13px;text-align:left;border-bottom:1px solid var(--line)}
th{
  color:var(--fg3);font-weight:500;font-size:10.5px;letter-spacing:.8px;
  font-family:var(--mono);position:sticky;top:0;white-space:nowrap;
  background:rgba(10,16,30,.97);backdrop-filter:blur(6px);z-index:2;
}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(125,211,252,.05)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
/* 勾选列：记忆条目按条删除时用（窄、居中、不参与文本列宽竞争） */
th.pick,td.pick{width:34px;padding-left:13px;padding-right:4px;text-align:center}
th.pick input,td.pick input{margin:0;cursor:pointer;vertical-align:middle}
.scroll{max-height:440px;overflow:auto}
.nowrap{white-space:nowrap}

/* ── 角色库表 ──
 * 默认表格布局会把宽度优先让给文本最长的"资料"列，于是"外号"输入框被挤到
 * 只剩几十像素（用户反馈"输入框非常短"）。这里把外号列钉死、允许资料列换行。 */
table.t-char th:nth-child(1),table.t-char td:nth-child(1){white-space:nowrap}
table.t-char th:nth-child(2),table.t-char td:nth-child(2){white-space:normal;min-width:200px}
table.t-char th:nth-child(3),table.t-char td:nth-child(3){width:340px;min-width:240px}
table.t-char th:nth-child(4),table.t-char td:nth-child(4){width:130px;white-space:nowrap}

/* ── 勾选项（会话设置的"额外规则"）──
 * 这个类以前没定义过：全局 `input{width:100%}` 会把复选框拉满整个单元格，
 * 看着像一排错位的长条。这里改回 inline + 自然宽度。 */
.chk{
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  color:var(--fg2);font-size:12px;white-space:nowrap;
}
.chk input[type="checkbox"]{width:auto;padding:0;margin:0;accent-color:#6ee7c0}

/* ── 表单 ── */
label.f{display:block;margin-bottom:13px}
label.f > span{display:block;color:var(--fg2);font-size:12.5px;font-weight:500;margin-bottom:6px;font-family:var(--sans);letter-spacing:.2px;line-height:1.45}
input,select,textarea{
  font:inherit;color:var(--fg);background:rgba(6,11,22,.72);
  border:1px solid var(--line2);border-radius:10px;padding:7px 11px;width:100%;
  transition:border-color .18s,box-shadow .18s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(100,240,200,.55);box-shadow:0 0 0 3px rgba(100,240,200,.12)}
select option{background:#0b1220;color:var(--fg)}
/* 会话下拉用等宽字体 + 服务端给的「实例 · 类型 · 名字」三段，
   前端再把实例名补到等宽，整列就能对齐（比例字体补空格是对不齐的）。 */
select.sess{font-family:var(--mono);font-size:12.5px}
textarea{min-height:90px;resize:vertical;line-height:1.6;font-size:13px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row > *{flex:1 1 160px;min-width:0}
.row > .fix{flex:0 0 auto}
.hidden{display:none !important}

/* ── 进度条（加载动画由 barGrow 从 0 展开）── */
.bar{height:6px;border-radius:4px;background:rgba(125,150,200,.14);overflow:hidden;flex:none}
.bar > i{
  display:block;height:100%;border-radius:4px;width:var(--w,0%);
  background:var(--grad);box-shadow:0 0 10px rgba(100,240,200,.4);
  animation:barGrow .9s cubic-bezier(.22,1,.36,1) both;
}
@keyframes barGrow{from{width:0}}

/* ── 状态大仪表 ── */
.meterbox{
  background:rgba(12,18,32,.55);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;transition:border-color .22s;
}
.meterbox:hover{border-color:var(--line2)}
.meterbox .m-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.meterbox .m-name{font-size:12px;color:var(--fg2);font-weight:600}
.meterbox .m-val{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.meterbox .m-hint{margin-top:7px;font-size:10.5px;color:var(--fg3)}

/* ── 代码块 / JSON 高亮 ── */
pre.out{
  background:rgba(5,9,18,.78);border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;max-height:430px;overflow:auto;white-space:pre-wrap;
  word-break:break-word;font-family:var(--mono);font-size:12px;line-height:1.68;margin:0;
}
.jk{color:var(--acc)} .js{color:#c9d6ee} .jn{color:var(--warn)} .jb{color:var(--summary)}

/* ── 标签 ── */
.tag{
  display:inline-flex;align-items:center;padding:1px 8px;border-radius:6px;font-size:11px;
  font-family:var(--mono);background:rgba(125,211,252,.07);
  border:1px solid var(--line2);color:var(--fg2);margin:2px 4px 2px 0;
}
.tag.topic{color:var(--topic);border-color:rgba(100,240,200,.32);background:rgba(100,240,200,.06)}
.tag.person{color:var(--person);border-color:rgba(110,231,160,.32);background:rgba(110,231,160,.06)}
.tag.fact{color:var(--fact);border-color:rgba(255,200,87,.32);background:rgba(255,200,87,.06)}
.tag.summary{color:var(--summary);border-color:rgba(180,140,255,.32);background:rgba(180,140,255,.06)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp)}
@media(max-width:960px){.split{grid-template-columns:1fr}}

/* ── 左右双栏：左竖排统计 / 右内容填满 ── */
.duo{display:grid;grid-template-columns:216px minmax(0,1fr);gap:14px;align-items:start}
.duo.wide{grid-template-columns:264px minmax(0,1fr)}
@media(max-width:960px){.duo,.duo.wide{grid-template-columns:1fr}}
.vlist{display:flex;flex-direction:column;gap:8px;min-width:0}
.vlist .kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 12px}
.vlist .kv .k{font-size:11px;flex:none}
.vlist .kv .v{font-size:14px;margin-top:0;text-align:right;flex:1;min-width:0}
.vlist .kv .v.sm{font-size:11.5px}
@media(max-width:960px){
  .vlist{flex-direction:row;flex-wrap:wrap}
  .vlist .kv{flex:1 1 150px}
}
.fill-h{max-height:calc(100dvh - 236px);min-height:320px}
.fill-h2{max-height:calc(100dvh - 300px);min-height:280px}
.useropt b{font-weight:600}
.useropt i{font-style:normal;color:var(--fg3);font-size:11px;margin-left:6px}

/* ── 主动消息 · 分会话配置内联编辑表 ── */
#poTable input, #poTable select{
  font-size:12px;padding:4px 7px;border-radius:8px;width:100%;min-width:0;
}
#poTable td{vertical-align:middle}
#poTable .po-add td{background:rgba(125,211,252,.04)}
#poTable th{white-space:nowrap}

/* ── 骨架屏 ── */
.skelbox{padding:18px}
.skel{
  height:14px;border-radius:7px;margin:11px 0;
  background:linear-gradient(100deg,rgba(125,160,220,.08) 32%,rgba(125,200,255,.17) 50%,rgba(125,160,220,.08) 68%);
  background-size:200% 100%;animation:shimmer 1.25s linear infinite;
}
@keyframes shimmer{from{background-position:130% 0}to{background-position:-70% 0}}

/* ── 知识图谱 ── */
.graphwrap{
  position:relative;overflow:hidden;border-radius:10px;
  background:radial-gradient(700px 420px at 50% 40%,rgba(100,240,200,.05),transparent 70%),rgba(5,9,18,.6);
  height:calc(100dvh - 236px);min-height:380px;
}
canvas#gcanvas{display:block;width:100%;height:100%;cursor:grab}
canvas#gcanvas:active{cursor:grabbing}
.legend{
  position:absolute;left:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;
  background:rgba(10,16,30,.82);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:11.5px;color:var(--fg2);
}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;box-shadow:0 0 6px currentColor}

/* ── Toast（弹簧滑入）── */
#toast{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{
  background:rgba(14,21,38,.92);backdrop-filter:blur(10px);
  border:1px solid var(--line2);border-left:3px solid var(--acc);
  border-radius:12px;padding:10px 15px;font-size:13px;max-width:430px;
  box-shadow:0 10px 30px rgba(2,6,18,.6);
  animation:toastIn .45s cubic-bezier(.34,1.56,.64,1) both;
  display:flex;align-items:center;gap:8px;
}
.toast::before{content:"✓";color:var(--acc);font-weight:700}
.toast.bad{border-left-color:var(--bad)}
.toast.bad::before{content:"!";color:var(--bad)}
.toast.bye{opacity:0;transform:translateX(26px);transition:.25s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(34px) scale(.94)}}

/* ── 页内确认/输入弹窗 ──
   插件页 iframe 的 sandbox 没有 allow-modals，原生 confirm()/prompt()
   会被浏览器静默拦成 false/null（按钮点了没反应），必须自绘。 */
.confirm-mask{
  position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  background:rgba(3,6,14,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  animation:maskIn .18s ease both;
}
@keyframes maskIn{from{opacity:0}}
.confirm-box{
  width:min(440px,calc(100vw - 48px));
  background:rgba(16,23,40,.97);border:1px solid var(--line2);border-radius:14px;
  box-shadow:var(--shadow);padding:18px 20px 16px;color:var(--fg);
  animation:boxIn .22s cubic-bezier(.22,1,.36,1) both;
}
@keyframes boxIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.confirm-box .cm-msg{font-size:13.5px;line-height:1.65;color:var(--fg);margin:2px 0 16px;white-space:pre-wrap}
.confirm-box .cm-input{
  font:inherit;color:var(--fg);background:rgba(6,11,22,.8);
  border:1px solid var(--line2);border-radius:10px;padding:8px 12px;width:100%;margin:4px 0 16px;
}
.confirm-box .cm-input:focus{outline:none;border-color:rgba(100,240,200,.55);box-shadow:0 0 0 3px rgba(100,240,200,.12)}
.confirm-box.wide{width:min(720px,calc(100vw - 48px))}
.confirm-box textarea.cm-input{min-height:220px;resize:vertical;line-height:1.6;font-size:12.5px}
.confirm-box .cm-actions{display:flex;justify-content:flex-end;gap:10px}

/* ── 窄屏：侧栏折为顶部横向导航（不再依赖 sticky 偏移）── */
@media(max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  #side{flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid var(--line);overflow:hidden}
  .brand{padding:10px 14px}
  .brand .logo{width:32px;height:32px}
  .brand .bt span{display:none}
  #tabs{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 8px;gap:6px}
  #tabs button{padding:7px 11px;flex:none}
  #tabs button .ix{display:none}
  #tabs button.on::before{left:10%;right:10%;top:auto;bottom:-1px;width:auto;height:2.5px}
  .side-foot{display:none}
  #content{padding:16px 14px 60px}
  #topbar{padding:12px 14px}
  #pageTitle{font-size:16px}
}
/* ── 手机竖屏（vivo S20：2800×1260 @ 20:9，DPR≈3，CSS 视口≈420px 宽）──
 * 设计原则：单列堆叠、全宽触控目标、表格容器内横向滚动、
 * 取消嵌套滚动（页面整体滚）、收窄滚动条、适配底部手势条 safe-area。 */
@media(max-width:640px){
  :root{--r:12px;--r2:8px;--sp:12px}
  #tabs button{min-height:42px;padding:9px 12px;font-size:13.5px}
  #topbar{gap:10px;padding:11px 12px}
  #topbar .actions{width:100%;display:flex;gap:8px}
  #topbar .actions button{flex:1 1 0;justify-content:center;padding:9px 8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pageTitle{font-size:16px}
  #pageDesc{font-size:11.5px}
  #content{padding:14px 12px calc(26px + env(safe-area-inset-bottom))}
  .card > h2{padding:11px 13px}
  .card > h2 .hint{flex:1 1 100%;min-width:0;width:100%}
  .card .body{padding:13px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
  .kv{padding:9px 11px}
  .kv .v{font-size:17px}
  .row{gap:8px}
  .row > *{flex:1 1 100%}
  .row > .fix{flex:0 0 auto}
  .vlist{flex-direction:column}
  .vlist .kv{flex:1 1 100%}
  /* 特权覆盖表单：固定宽输入框按可用宽度铺满 */
  .pr-scope,.pr-qids{width:100% !important;max-width:100%}
  .pr-add{flex-direction:column;align-items:stretch}
  .pr-add button{width:100%;justify-content:center}
  /* 表格：容器内横向滚动、细单元格、去掉 sticky 表头（页面整体滚时避免错位） */
  .scroll{max-height:none;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  th,td{padding:7px 9px;font-size:12.3px}
  th{position:static}
  table.t-char th:nth-child(2),table.t-char td:nth-child(2){min-width:140px}
  table.t-char th:nth-child(3),table.t-char td:nth-child(3){width:auto;min-width:200px}
  /* 直接铺在 body / 双栏里的零散表格：块级 + 横向滚动兜底 */
  .body > table,.split > table,.duo > table,#gSearchOut table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .fill-h,.fill-h2{max-height:none;min-height:0}
  .graphwrap{height:62dvh;min-height:300px}
  .legend{bottom:8px;left:8px;right:8px;font-size:10.5px;padding:5px 9px}
  pre.out{max-height:300px;padding:11px 12px;font-size:11.5px}
  #toast{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));align-items:stretch}
  .toast{max-width:none;width:100%;font-size:12.5px;padding:10px 13px}
  .confirm-box{width:calc(100vw - 30px);padding:16px 16px 14px}
  .meterbox .m-val{font-size:18px}
  /* 手机滚动条收窄 */
  ::-webkit-scrollbar{width:4px;height:4px}
  input,select,textarea{padding:8px 11px}
}
@media(max-width:400px){
  #pageTitle{font-size:15px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
let SESSIONS = null;
let UNAMES = {};   // uid → 昵称（/sessions 返回）
let SLABELS = {};  // umo → 友好会话标签（实例|群聊/私聊|QQ号|昵称）
let CUR_PERSONA = "";
let GRAPH = null;

async function ensureSessions(){
  if (!SESSIONS) {
    SESSIONS = await get("/sessions");
    UNAMES = SESSIONS.user_names || {};
    SLABELS = SESSIONS.labels || {};
  }
  computeInstWidth();   // 会话下拉的实例列宽（补空格做对齐）
  return SESSIONS;
}
/* 会话展示：优先用服务端算好的友好标签，兜底回退 umo 原文 */
function sessLabel(umo){
  const l = SLABELS[umo];
  return l ? l : String(umo || "—");
}
/* 下拉用的会话文案：`实例 · 类型 · 名字`，实例名补到最长那个，整列对齐。
 * 补的是 nbsp —— 普通空格在 <option> 里会被 HTML 折叠掉。 */
let INST_W = 0;
/* 最长实例名 —— 在 ensureSessions() 里统一算，保证任何入口都拿得到 */
function computeInstWidth(){
  INST_W = ((SESSIONS && SESSIONS.sessions) || []).reduce(function(m, s){
    return Math.max(m, String((s && s.instance) || "").length);
  }, 0);
}
function paddedInstance(s){
  const nm = String((s && s.instance) || "");
  const pad = Math.max(0, (INST_W || nm.length) - nm.length);
  return nm + "\u00a0".repeat(pad);
}
function sessOptionText(s){
  if (!s || !s.kind) return sessLabel(s && s.umo);
  return paddedInstance(s) + " · " + s.kind + " · " + String(s.name || "");
}
function sessOptions(){
  return ((SESSIONS && SESSIONS.sessions) || []).map(function(s){
    return '<option value="' + esc(s.umo) + '" title="' + esc(s.umo) + '">'
      + esc(sessOptionText(s)) + '</option>';
  }).join("");
}
/* 文本里的「成员 QQ」→「昵称（QQ）」 */
function dispName(uid, nm){
  // 平台偶尔把 QQ 号当昵称返回 —— 那不是昵称，显示成「123（123）」很蠢
  const s = String(nm == null ? "" : nm).trim();
  return s === String(uid) ? "" : s;
}
function userLabel(uid, names){
  const nm = dispName(uid, (names || {})[uid] || "");
  return uid + (nm ? "（" + nm + "）" : "");
}

/* 传输层：必须走 AstrBot 的插件页桥（window.AstrBotPluginPage）。
 * 插件页以 iframe 加载，鉴权 token 在父窗口，裸请求会在网络层失败。
 * 桥脚本由服务端注入在 body 结束标签之前（晚于本页脚本），故需轮询等待。
 * 桥的约定：endpoint 是相对路径、不能含问号；查询参数走第二个参数。 */
function withTimeout(promise, ms, msg){
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error(msg)), ms);
    Promise.resolve(promise).then(
      (v) => { clearTimeout(t); resolve(v); },
      (e) => { clearTimeout(t); reject(e); });
  });
}
function bridgeReady(timeoutMs){
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    (function poll(){
      const B = window.AstrBotPluginPage;
      if (B && typeof B.apiGet === "function") {
        withTimeout(B.ready(), 1500, "ready-timeout")
          .catch(() => {}).then(() => resolve(B));
        return;
      }
      if (Date.now() - t0 > (timeoutMs || 12000)) {
        reject(new Error("插件页桥未加载：请从 AstrBot WebUI 的插件页入口打开本页"));
        return;
      }
      setTimeout(poll, 50);
    })();
  });
}

/* 顶部细进度条：任意请求进行中时点亮 */
let BQ = 0;
function busyTick(d){
  BQ = Math.max(0, BQ + d);
  const bar = document.getElementById("busybar");
  if (bar) bar.classList.toggle("on", BQ > 0);
}
async function call(path, opts){
  busyTick(1);
  try {
    const B = await bridgeReady();
    const p = String(path || "").replace(/^\/+/, "");
    const qi = p.indexOf("?");
    const ep = qi >= 0 ? p.slice(0, qi) : p;
    const params = {};
    if (qi >= 0) {
      new URLSearchParams(p.slice(qi + 1)).forEach((v, k) => { params[k] = v; });
    }
    const method = String((opts && opts.method) || "GET").toUpperCase();
    let out;
    if (method === "POST") {
      let body = {};
      if (opts && opts.body) {
        try { body = JSON.parse(opts.body); } catch (e) { body = {}; }
      }
      out = await withTimeout(B.apiPost(ep, body), 60000, "请求超时：父窗口没有响应");
    } else {
      out = await withTimeout(B.apiGet(ep, params), 60000, "请求超时：父窗口没有响应");
    }
    if (out && typeof out === "object" && out.ok === false) {
      throw new Error(out.error || out.message || "未知错误");
    }
    return out;
  } finally { busyTick(-1); }
}
const get  = (p) => call(p);
const post = (p, body) => call(p, {method:"POST", body: JSON.stringify(body||{})});

function toast(msg, bad){
  const d = document.createElement("div");
  d.className = "toast" + (bad ? " bad" : "");
  d.textContent = msg;
  document.getElementById("toast").appendChild(d);
  setTimeout(function(){
    d.classList.add("bye");
    setTimeout(function(){ d.remove(); }, 260);
  }, bad ? 6000 : 3200);
}
/* 页内二次确认：插件页 iframe 沙箱没有 allow-modals，原生 confirm()
   会被浏览器静默拦成 false（表现为点了没反应），所以自绘弹窗。
   返回 Promise<boolean>；Esc / 点遮罩 / 取消 = false，Enter / 确定 = true。
   破坏性操作为防误回车，默认焦点在「取消」。 */
function askConfirm(msg, opt){
  return new Promise(function(resolve){
    opt = opt || {};
    const mask = document.createElement("div");
    mask.className = "confirm-mask";
    mask.innerHTML = '<div class="confirm-box" role="alertdialog" aria-modal="true">'
      + '<div class="cm-msg">' + esc(msg) + '</div>'
      + '<div class="cm-actions">'
      + '<button class="cm-cancel" title="取消操作（Esc）">取消</button>'
      + '<button class="danger cm-ok" title="确认并继续">' + esc(opt.ok || "确定") + '</button>'
      + '</div></div>';
    const box = mask.querySelector(".confirm-box");
    const ok = mask.querySelector(".cm-ok");
    const cancel = mask.querySelector(".cm-cancel");
    let done = false;
    function close(val){
      if (done) return; done = true;
      document.removeEventListener("keydown", onKey);
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      resolve(val);
    }
    function onKey(e){
      if (e.key === "Escape") close(false);
      else if (e.key === "Enter") { e.preventDefault(); close(true); }
    }
    ok.addEventListener("click", function(){ close(true); });
    cancel.addEventListener("click", function(){ close(false); });
    mask.addEventListener("click", function(e){ if (e.target === mask) close(false); });
    box.addEventListener("click", function(e){ e.stopPropagation(); });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(mask);
    cancel.focus();
  });
}
/* 页内输入框（替代原生 prompt，同样被沙箱拦截返回 null）。
   `opt.multiline` = true 时用多行文本框（记忆正文这类长文本用，回车换行、
   Ctrl/Cmd+Enter 才提交）。 */
function askPrompt(msg, def, opt){
  opt = opt || {};
  return new Promise(function(resolve){
    const mask = document.createElement("div");
    mask.className = "confirm-mask";
    mask.innerHTML = '<div class="confirm-box' + (opt.multiline ? ' wide' : '')
      + '" role="dialog" aria-modal="true">'
      + '<div class="cm-msg">' + esc(msg) + '</div>'
      + (opt.multiline
          ? '<textarea class="cm-input" rows="10">' + esc(def || "") + '</textarea>'
          : '<input class="cm-input" type="text" value="' + esc(def || "") + '">')
      + '<div class="cm-actions">'
      + '<button class="cm-cancel" title="取消操作（Esc）">取消</button>'
      + '<button class="primary cm-ok" title="确认并继续（'
      + (opt.multiline ? "Ctrl+Enter" : "Enter") + '）">' + esc(opt.ok || "确定")
      + '</button>'
      + '</div></div>';
    const box = mask.querySelector(".confirm-box");
    const inp = mask.querySelector(".cm-input");
    const ok = mask.querySelector(".cm-ok");
    const cancel = mask.querySelector(".cm-cancel");
    let done = false;
    function close(val){
      if (done) return; done = true;
      document.removeEventListener("keydown", onKey);
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      resolve(val);
    }
    function onKey(e){
      if (e.key === "Escape") { close(null); return; }
      if (e.key !== "Enter") return;
      // 多行框里回车是换行，只有 Ctrl/Cmd+Enter 才提交
      if (opt.multiline && !(e.ctrlKey || e.metaKey)) return;
      e.preventDefault(); close(inp.value);
    }
    ok.addEventListener("click", function(){ close(inp.value); });
    cancel.addEventListener("click", function(){ close(null); });
    mask.addEventListener("click", function(e){ if (e.target === mask) close(null); });
    box.addEventListener("click", function(e){ e.stopPropagation(); });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(mask);
    inp.focus();
    if (opt.multiline) inp.setSelectionRange(inp.value.length, inp.value.length);
    else inp.select();
  });
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function num(v, d){ return (v === null || v === undefined || v === "") ? (d===undefined?"—":d) : v; }
function bytes(n){
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KB";
  return (n/1048576).toFixed(2) + " MB";
}
function ago(ts){
  if (!ts) return "—";
  const d = Math.max(0, Date.now()/1000 - Number(ts));
  if (d < 60) return Math.floor(d) + " 秒前";
  if (d < 3600) return Math.floor(d/60) + " 分钟前";
  if (d < 86400) return Math.floor(d/3600) + " 小时前";
  return Math.floor(d/86400) + " 天前";
}
function kv(k, v, cls){
  const s = (v === null || v === undefined || v === "") ? "—" : String(v);
  const isNum = /^[0-9]+(\.[0-9]+)?$/.test(s);
  return '<div class="kv"><div class="k">' + esc(k) + '</div>'
       + '<div class="v ' + (cls||"") + '"' + (isNum ? ' data-count="' + s + '"' : "")
       + '>' + esc(s) + '</div></div>';
}
function kvGrid(items){
  return '<div class="grid">' + items.map(function(a){ return kv(a[0], a[1], a[2]); }).join("") + '</div>';
}
/* 竖排统计（左右布局的左侧栏） */
function kvCol(items){
  return '<div class="vlist">' + items.map(function(a){ return kv(a[0], a[1], a[2]); }).join("") + '</div>';
}
/* 对象 → 友好键值渲染（替代裸 JSON）：
 * 标量键渲染成 kv 砖；数组渲染成标签；嵌套对象递归成小节。 */
function kvObj(obj){
  const o = obj || {};
  const scalar = {}, array = {}, nested = {};
  Object.keys(o).forEach(function(k){
    const v = o[k];
    if (v !== null && typeof v === "object") {
      (Array.isArray(v) ? array : nested)[k] = v;
    } else { scalar[k] = v; }
  });
  let html = "";
  const sk = Object.keys(scalar);
  if (sk.length) html += '<div class="grid">' + sk.map(function(k){
    return kv(k, scalar[k]); }).join("") + '</div>';
  Object.keys(array).forEach(function(k){
    const v = array[k];
    html += '<div class="hint" style="margin:9px 0 4px">' + esc(k)
      + '（' + v.length + '）</div><div>'
      + (v.length ? v.map(function(x){
          return '<span class="tag">' + esc(typeof x === "object"
            ? JSON.stringify(x) : x) + '</span>'; }).join("")
        : '<span class="hint">（空）</span>')
      + '</div>';
  });
  Object.keys(nested).forEach(function(k){
    html += '<div class="hint" style="margin:9px 0 4px">' + esc(k) + '</div>'
      + kvObj(nested[k]);
  });

/* 数字滚动动画 */
function countUpAll(root){
  (root || document).querySelectorAll("[data-count]").forEach(function(el){
    const raw = el.getAttribute("data-count");
    const t = parseFloat(raw);
    if (isNaN(t)) return;
    const dec = raw.indexOf(".") >= 0 ? (raw.split(".")[1] || "").length : 0;
    const t0 = performance.now(), dur = 720;
    function step(now){
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = (t * e).toFixed(dec);
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = t.toFixed(dec);
    }
    requestAnimationFrame(step);
  });
}

/* JSON 语法高亮渲染 */
function jhtml(v, ind){
  const sp = "  ";
  const pad = new Array((ind || 0) + 1).join(sp);
  if (v === null) return '<span class="jb">null</span>';
  if (typeof v === "boolean") return '<span class="jb">' + v + '</span>';
  if (typeof v === "number") return '<span class="jn">' + v + '</span>';
  if (typeof v === "string") return '<span class="js">"' + esc(v) + '"</span>';
  if (Array.isArray(v)) {
    if (!v.length) return "[]";
    return "[\n" + v.map(function(x){
      return pad + sp + jhtml(x, (ind || 0) + 1);
    }).join(",\n") + "\n" + pad + "]";
  }
  const keys = Object.keys(v);
  if (!keys.length) return "{}";
  return "{\n" + keys.map(function(k){
    return pad + sp + '<span class="jk">"' + esc(k) + '"</span>: ' + jhtml(v[k], (ind || 0) + 1);
  }).join(",\n") + "\n" + pad + "}";
}
function jpre(obj){
  return '<pre class="out">' + jhtml(obj, 0) + '</pre>';
}

function subsystemRows(s){
  // 「启用/关闭」必须来自 `/stats.features` —— 后端按**实现里真正用来开门的

  // 旧写法是"从 /stats 里顺手挑一个字段当布尔"，挑到计数就完了：
  // `用户印象` 读 updated、`长期记忆` 读 atoms、`知识图谱` 读 nodes，
  // 于是功能开着但只要还没有产出数据就显示"关闭"。
  const rows = Array.isArray(s.features) ? s.features : [];
  if (!rows.length) {
    return '<tr><td colspan="3" class="empty">'
      + '后端未返回功能开关表（插件可能是旧版本，重载插件即可）</td></tr>';
  }
  return rows.map(function(r){
    const cls = r.enabled ? "on" : "off";
    const txt = r.enabled ? "启用" : "关闭";
    return '<tr><td>' + esc(r.name) + '</td>'
         + '<td><span class="pill ' + cls + '">' + txt + '</span></td>'
         + '<td class="hint mono" style="font-size:11px">' + esc(r.gate || "")
         + (r.detail ? ' <span style="font-family:inherit">· '
             + esc(r.detail) + '</span>' : "")
         + '</td></tr>';
  }).join("");
}

/* 补齐群名与成员昵称：平台不一定把 `group_name` 带在每条消息里，
 * 迁移过来的历史用户更是从来没记过昵称，页面上就只剩一串 QQ 号。
 * 这个按钮调一次 OneBot 的 get_group_info / get_group_member_list /
 * get_friend_list 把本地映射表补满 —— 只写映射表，不动任何聊天状态。 */
async function refreshNames(btn){
  const r = await post("/sessions/refresh-names", {groups:true, members:true, friends:true});
  const parts = ["群名 " + (r.group_names||0), "昵称 " + (r.users||0)];
  if (r.groups) parts.push("扫描 " + r.groups + " 个群");
  if (r.budget_exhausted) parts.push("达到调用上限，可再点一次");
  if (r.deadline_hit) parts.push("超时收工，可再点一次补齐剩余");
  if ((r.skipped||[]).length) parts.push("跳过 " + r.skipped.length + " 项");
  if ((r.errors||[]).length) parts.push("失败 " + r.errors.length + " 项");
  // 会话标签/下拉的数据源变了，缓存必须作废，否则页面还是旧名字
  SESSIONS = null; UNAMES = {}; SLABELS = {};
  toast("已补齐：" + parts.join("，"), (r.errors||[]).length > 0);
  if ((r.errors||[]).length) console.warn("补齐失败项：", r.errors, r.skipped);
  await refresh();
}

function paintMeter(barId, valId, v){
  const bar = document.getElementById(barId);
  const lab = document.getElementById(valId);
  const n = Math.max(0, Math.min(100, parseInt(v, 10)));
  if (isNaN(n)) return;
  if (bar) bar.style.setProperty("--w", n + "%");
  if (lab) lab.textContent = n;
}

/* 最近一次加载到的记忆条目（「编辑」要取完整正文，表格里是截断显示的） */
let memAtoms = [];

async function loadMemory(){
  const umo = val("memUmo");
  if (!umo) return;
  const d = await get(withInst("/memory?umo=" + encodeURIComponent(umo)));
  const st = d.stats || {}, g = st.graph || {};
  document.getElementById("memStats").innerHTML = kvCol([
    ["记忆键", d.key, "sm"], ["条目数", (d.atoms||[]).length],
    ["待固化轮数", d.pending], ["图谱节点", g.nodes],
    ["图谱边", g.edges], ["条目↔节点链接", g.entry_links],
    ["已固化", st.consolidated], ["降级固化", st.degraded],
    ["embedding", st.available ? "可用" : "不可用"],
  ]);
  countUpAll(document.getElementById("memStats"));
  const atoms = d.atoms || [];
  memAtoms = atoms;
  const box = document.getElementById("memList");
  box.innerHTML = atoms.length
    ? '<table><thead><tr>'
      + '<th class="pick"><input type="checkbox" id="memAll" title="全选 / 取消全选"></th>'
      + '<th>时间</th><th>话题</th><th>内容</th>'
      + '<th class="num">命中</th><th class="num">向量</th><th></th></tr></thead><tbody>'
      + atoms.map(function(a){
          const tp = (a.topics||[]).map(function(t){
            return '<span class="tag topic">' + esc(t) + '</span>'; }).join("")
            || '<span class="hint">—</span>';
          return '<tr><td class="pick"><input type="checkbox" class="mem-pick"'
            + ' value="' + esc(a.id) + '" title="' + esc(a.id) + '"></td>'
            + '<td class="hint mono" style="white-space:nowrap;font-size:11px">' + esc(ago(a.ts)) + '</td>'
            + '<td>' + tp + '</td>'
            + '<td>' + esc((a.text||"").slice(0,220))
            + (a.degraded ? ' <span class="tag fact" title="总结失败，用原文兜底">降级</span>' : "")
            + '</td><td class="num">' + esc(a.hits) + '</td>'
            + '<td class="num">' + (a.has_vec ? "有" : '<span class="hint">无</span>') + '</td>'
            + '<td style="white-space:nowrap"><button class="mem-edit"'
            + ' data-id="' + esc(a.id) + '"'
            + ' title="编辑这条记忆的正文（保存时会重算向量并重建它的图谱条目）">编辑</button></td></tr>';
        }).join("") + '</tbody></table>'
    : '<div class="empty">该会话还没有固化出记忆（攒够阈值后才会生成）</div>';
  const all = document.getElementById("memAll");
  if (all) all.addEventListener("change", function(){
    box.querySelectorAll(".mem-pick").forEach(function(c){ c.checked = all.checked; });
    syncDelBtn();
  });
  box.querySelectorAll(".mem-pick").forEach(function(c){
    c.addEventListener("change", function(){
      const ps = box.querySelectorAll(".mem-pick");
      const n = box.querySelectorAll(".mem-pick:checked").length;
      if (all) { all.checked = n > 0 && n === ps.length; all.indeterminate = n > 0 && n < ps.length; }
      syncDelBtn();
    });
  });
  box.querySelectorAll(".mem-edit").forEach(function(b){
    b.addEventListener("click", function(){
      const id = b.dataset.id;
      busy(b, function(){ return editMemory(id); });
    });
  });
  syncDelBtn();
}

/* 编辑单条记忆的正文（向量与图谱条目由后端一起重建） */
async function editMemory(atomId){
  const a = (memAtoms || []).filter(function(x){ return x.id === atomId; })[0];
  if (!a) { toast("找不到这条记忆了，先切一下会话刷新", true); return; }
  const nt = await askPrompt(
    "编辑这条记忆的正文。保存后会重新算向量、并按新正文重建它的图谱条目"
    + "（原来的话题与参与者保留）：", a.text || "", {multiline: true});
  if (nt === null) return;
  const t = String(nt).trim();
  if (!t) { toast("正文不能为空", true); return; }
  if (t === String(a.text || "").trim()) { toast("内容没变，未保存"); return; }
  const r = await post("/memory/edit",
    {umo: val("memUmo"), id: atomId, text: t});
  if (r.error) { toast("保存失败：" + memEditErr(r.error), true); return; }
  toast("已更新记忆" + (r.graph_dropped
    ? "（重建图谱条目 " + r.graph_dropped + " 条）" : ""));
  await loadMemory();
}

/* 编辑失败的原因翻译成中文（后端只回错误码，不暴露内部细节） */
function memEditErr(code){
  return {
    empty: "正文不能为空",
    too_long: "内容太长（上限 4000 字）",
    not_found: "这条记忆已经不在了（可能刚被删除）",
    unchanged: "内容没变",
    embedding_unavailable: "embedding 不可用（记忆功能已关或模型没配好）",
    embedding_failed: "算不出向量，embedding 调用失败",
    missing_id: "缺少记忆 id",
  }[code] || code;
}

/* 勾选的记忆 id（保持表格顺序） */
function memPickedIds(){
  const box = document.getElementById("memList");
  if (!box) return [];
  return Array.prototype.map.call(box.querySelectorAll(".mem-pick:checked"),
    function(c){ return c.value; });
}
/* 「删除选中」按钮：没有勾选时禁用 */
function syncDelBtn(){
  const b = document.getElementById("btnDelSel");
  if (b) b.disabled = memPickedIds().length === 0;
}

async function runRecall(){
  const umo = val("memUmo");
  const q = val("memQuery").trim();
  if (!q) throw new Error("请先输入查询语句");
  const box = document.getElementById("recallOut");
  box.innerHTML = '<div class="empty"><div class="skel" style="width:40%;margin:0 auto"></div>'
    + '<div style="margin-top:8px;font-size:12px">双路召回中…</div></div>';
  const d = await post("/memory/recall", {umo: umo, query: q, top_k: 8,
    persona: val("memPersona"), policy: parseInt(val("memPolicy") || "0", 10) || 0});
  if (d.error) { box.innerHTML = '<pre class="out" style="margin-top:12px">' + esc(d.error) + '</pre>'; return; }
  const w = d.weights || {};
  const docTxt = (d.doc_hits||[]).map(function(h){
    return "[" + h.score + "]" + (h.passed_min_score ? "" : " ✗被下限挡掉") + " " + h.text;
  }).join("\n\n") || "（无命中）";
  const grTxt = (d.graph_hits||[]).map(function(h){
    return "[" + h.score + "] " + h.text;
  }).join("\n\n") || "（无命中）";
  const fuTxt = (d.fused||[]).map(function(h,i){
    return (i+1) + ". [合计 " + h.final + " = 文档 " + h.doc + " + 图谱 " + h.graph + "]\n" + h.text;
  }).join("\n\n") || "（无）";
  box.innerHTML =
    '<div class="grid" style="margin:12px 0">'
    + kv("意图", d.intent) + kv("文档路权重", w.document) + kv("图谱路权重", w.graph)
    + kv("相似度下限", d.min_score) + kv("文档命中", (d.doc_hits||[]).length)
    + kv("图谱命中", (d.graph_hits||[]).length) + kv("融合结果", (d.fused||[]).length)
    + kv("人格策略", d.policy_label || d.policy)
    + '</div><div class="split">'
    + '<div><div class="hint" style="margin-bottom:6px">文档路（记忆条目向量）</div>'
    + '<pre class="out">' + esc(docTxt) + '</pre></div>'
    + '<div><div class="hint" style="margin-bottom:6px">图谱路（BM25 + 条目向量 → RRF）</div>'
    + '<pre class="out">' + esc(grTxt) + '</pre></div></div>'
    + '<div class="hint" style="margin:12px 0 6px">融合后实际注入的内容</div>'
    + '<pre class="out">' + esc(fuTxt) + '</pre>';
  countUpAll(box);
}

let G = null;
let GHANDLERS = [];   // 图谱的 window 级监听器：切换页签时必须摘掉，否则会累积

async function loadGraph(){
  const p = window.__GRAPH_PERSONA__ || "";
  const d = await get(withInst("/graph?limit=180" + (p ? "&persona=" + encodeURIComponent(p) : "")));
  GRAPH = d;
  const psel = document.getElementById("graphPersona");
  if (psel && !psel.dataset.filled) {
    const opts = (d.personas || []).map(function(x){
      return '<option value="' + esc(x.id) + '">' + esc(x.name)
        + '（' + x.count + '）</option>';
    }).join("");
    psel.innerHTML = '<option value="">全部人格</option>' + opts;
    psel.value = p;
    psel.dataset.filled = "1";
    psel.addEventListener("change", function(){
      window.__GRAPH_PERSONA__ = psel.value;
      psel.dataset.filled = "";
      loadGraph().catch(function(e){ toast(e.message, true); });
    });
  }
  const st = d.stats || {};
  document.getElementById("graphStats").innerHTML = kvCol([
    ["节点", st.nodes], ["边", st.edges], ["图谱条目", st.entries],
    ["条目↔节点链接", st.entry_links], ["倒排词", st.tokens],
    ["文件大小", bytes(st.bytes)],
    ["本图节点", (d.nodes||[]).length], ["本图边", (d.edges||[]).length],
  ]);
  document.getElementById("gmeta").textContent = d.truncated
    ? "共 " + d.total_nodes + " 个节点，按连接数取前 " + (d.nodes||[]).length + " 个显示"
    : "全部 " + (d.nodes||[]).length + " 个节点";
  initGraph(d);
  countUpAll(document.getElementById("graphStats"));
}

function initGraph(d){
  // 切换页签会重新调用本函数；先摘掉上一轮挂在 window 上的监听器
  GHANDLERS.forEach(function(h){ window.removeEventListener(h[0], h[1]); });
  GHANDLERS = [];
  const listen = function(ev, fn, opt){
    window.addEventListener(ev, fn, opt);
    GHANDLERS.push([ev, fn]);
  };

  const cv = document.getElementById("gcanvas");
  const box = cv.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  // 高度跟容器走（容器用 dvh 撑满可视区），不再写死 540
  const W = Math.max(320, box.width), H = Math.max(320, box.height);
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const NCOL = {topic:"#64f0c8", person:"#6ee7a0", fact:"#ffc857", summary:"#b48cff"};
  const colorOf = function(t){ return NCOL[t] || "#8fa3c8"; };

  const nodes = (d.nodes || []).map(function(n, i){
    return Object.assign({}, n, {
      x: W/2 + Math.cos(i * 2.399) * (60 + Math.random()*W*0.3),
      y: H/2 + Math.sin(i * 2.399) * (50 + Math.random()*H*0.3),
      vx: 0, vy: 0,
      r: 5 + Math.min(13, Math.sqrt(n.degree || 0) * 3.2),
      rr: 0,   // 渲染半径：入场时从 0 长到 r
    });
  });
  const idx = {}; nodes.forEach(function(n, i){ idx[n.id] = i; });
  const edges = (d.edges || []).map(function(e){
    return Object.assign({}, e, {a: idx[e.source], b: idx[e.target]});
  }).filter(function(e){ return e.a !== undefined && e.b !== undefined; });

  G = {cv: cv, ctx: ctx, W: W, H: H, nodes: nodes, edges: edges,
       view: {x:0, y:0, k:1}, sel: null, alpha: 1, drag: null, pan: null,
       born: performance.now()};

  function tick(){
    const N = G.nodes, E = G.edges;
    for (let i = 0; i < N.length; i++) {
      const a = N[i];
      for (let j = i + 1; j < N.length; j++) {
        const b = N[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx*dx + dy*dy;
        if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
        if (d2 > 90000) continue;
        const dd = Math.sqrt(d2);
        const f = 2400 / d2;
        const fx = dx/dd*f, fy = dy/dd*f;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
    for (let k = 0; k < E.length; k++) {
      const e = E[k], a = N[e.a], b = N[e.b];
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dd = Math.max(1, Math.sqrt(dx*dx + dy*dy));
      const f = (dd - 78) * 0.014;
      const fx = dx/dd*f, fy = dy/dd*f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for (let k = 0; k < N.length; k++) {
      const n = N[k];
      n.vx += (W/2 - n.x) * 0.0022;
      n.vy += (H/2 - n.y) * 0.0028;
      n.vx *= 0.82; n.vy *= 0.82;
      if (n === G.drag) { n.vx = n.vy = 0; continue; }
      n.x += n.vx * G.alpha; n.y += n.vy * G.alpha;
    }
    G.alpha = Math.max(0.06, G.alpha * 0.994);
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(G.view.x, G.view.y);
    ctx.scale(G.view.k, G.view.k);
    // 边：二次贝塞尔曲线，选中邻居高亮
    ctx.lineWidth = 1 / G.view.k;
    for (let k = 0; k < G.edges.length; k++) {
      const e = G.edges[k], a = G.nodes[e.a], b = G.nodes[e.b];
      if (!a || !b) continue;
      const hot = G.sel && (G.sel.id === a.id || G.sel.id === b.id);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const nx = -(b.y - a.y) * 0.07, ny = (b.x - a.x) * 0.07;
      ctx.strokeStyle = hot ? "rgba(100,240,200,.8)" : "rgba(125,150,200,.20)";
      ctx.lineWidth = (hot ? 1.6 : 1) / G.view.k;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(mx + nx, my + ny, b.x, b.y);
      ctx.stroke();
    }
    // 节点：磷光发光 + 入场生长
    const t = performance.now();
    for (let k = 0; k < G.nodes.length; k++) {
      const n = G.nodes[k];
      n.rr += (n.r - n.rr) * 0.08;
      const c = colorOf(n.type);
      const isSel = G.sel && G.sel.id === n.id;
      ctx.beginPath();
      ctx.arc(n.x, n.y, Math.max(0.5, n.rr), 0, 6.2832);
      ctx.shadowColor = c;
      ctx.shadowBlur = isSel ? 22 : 10;
      ctx.fillStyle = isSel ? "#ffffff" : c;
      ctx.globalAlpha = .92; ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      if (isSel) {
        ctx.strokeStyle = c;
        ctx.lineWidth = 3 / G.view.k;
        ctx.globalAlpha = .55 + .3 * Math.sin(t / 260);
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.rr + 5 / G.view.k, 0, 6.2832);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (G.view.k > 0.75 || n.degree > 5) {
        ctx.fillStyle = "rgba(220,228,244,.85)";
        ctx.font = (11 / G.view.k) + "px ui-monospace,Consolas,monospace";
        ctx.textAlign = "center";
        ctx.fillText(String(n.value).slice(0, 10), n.x, n.y - n.rr - 5/G.view.k);
      }
    }
    ctx.restore();
  }

  function loop(){
    if (!G || G.cv !== cv) return;
    tick(); draw();
    requestAnimationFrame(loop);
  }
  loop();

  const toWorld = function(ev){
    const r = cv.getBoundingClientRect();
    return {x: (ev.clientX - r.left - G.view.x)/G.view.k,
            y: (ev.clientY - r.top - G.view.y)/G.view.k};
  };
  const pick = function(p){
    for (let i = G.nodes.length - 1; i >= 0; i--) {
      const n = G.nodes[i];
      if (Math.sqrt((n.x-p.x)*(n.x-p.x) + (n.y-p.y)*(n.y-p.y)) <= n.r + 3/G.view.k) return n;
    }
    return null;
  };
  cv.addEventListener("mousedown", function(ev){
    const p = toWorld(ev), n = pick(p);
    if (n) { G.drag = n; G.sel = n; G.alpha = Math.max(G.alpha, .5); showNode(n.id); }
    else { G.pan = {x: ev.clientX - G.view.x, y: ev.clientY - G.view.y}; }
  });
  listen("mousemove", function(ev){
    if (!G) return;
    if (G.drag) { const p = toWorld(ev); G.drag.x = p.x; G.drag.y = p.y; }
    else if (G.pan) { G.view.x = ev.clientX - G.pan.x; G.view.y = ev.clientY - G.pan.y; }
  });
  listen("mouseup", function(){ if (G) { G.drag = null; G.pan = null; } });
  // 窗口尺寸变化时重算画布，否则图会被拉伸/裁切
  listen("resize", function(){
    if (!G || G.cv !== cv) return;
    const b = cv.parentElement.getBoundingClientRect();
    const w = Math.max(320, b.width), h = Math.max(320, b.height);
    if (Math.abs(w - G.W) < 2 && Math.abs(h - G.H) < 2) return;
    G.W = w; G.H = h;
    const dpr2 = window.devicePixelRatio || 1;
    cv.width = w * dpr2; cv.height = h * dpr2;
    ctx.setTransform(dpr2, 0, 0, dpr2, 0, 0);
    fitGraph();
  });
  cv.addEventListener("wheel", function(ev){
    ev.preventDefault();
    const r = cv.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const k2 = Math.max(.25, Math.min(4, G.view.k * (ev.deltaY < 0 ? 1.1 : 0.9)));
    G.view.x = mx - (mx - G.view.x) * (k2 / G.view.k);
    G.view.y = my - (my - G.view.y) * (k2 / G.view.k);
    G.view.k = k2;
  }, {passive: false});

  fitGraph();
}

function fitGraph(){
  if (!G || !G.nodes.length) return;
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  G.nodes.forEach(function(n){
    if (n.x < minx) minx = n.x;
    if (n.x > maxx) maxx = n.x;
    if (n.y < miny) miny = n.y;
    if (n.y > maxy) maxy = n.y;
  });
  const pad = 46;
  const k = Math.min((G.W - pad*2)/Math.max(1, maxx-minx),
                     (G.H - pad*2)/Math.max(1, maxy-miny), 2.2);
  G.view.k = Math.max(.25, k);
  G.view.x = G.W/2 - (minx+maxx)/2 * G.view.k;
  G.view.y = G.H/2 - (miny+maxy)/2 * G.view.k;
}

async function showNode(key){
  const box = document.getElementById("graphNode");
  box.innerHTML = '<div class="card"><div class="body"><div class="empty">读取节点…</div></div></div>';
  const d = await get(withInst("/graph/node?key=" + encodeURIComponent(key)));
  if (d.error) {
    box.innerHTML = '<div class="card"><div class="body"><div class="empty">'
      + esc(d.error) + '</div></div></div>';
    return;
  }
  const n = d.node, meta = n.meta || {};
  const nb = (d.neighbors||[]).map(function(x){
    const c = (typeof x.confidence === "number") ? x.confidence.toFixed(2) : x.confidence;
    return '<tr><td><span class="tag">' + esc(x.relation) + '</span></td>'
      + '<td><span class="tag ' + esc(x.type) + '">' + esc(x.value) + '</span></td>'
      + '<td class="num">' + esc(c) + '</td></tr>';
  }).join("") || '<tr><td colspan="3" class="empty">没有邻居</td></tr>';
  const en = (d.entries||[]).map(function(e){
    return '<tr><td><span class="tag ' + esc(e.type) + '">' + esc(e.type) + '</span></td>'
      + '<td>' + esc(e.content.slice(0,180)) + '</td></tr>';
  }).join("") || '<tr><td colspan="2" class="empty">没有条目</td></tr>';
  box.innerHTML =
    '<div class="card"><h2>节点详情'
    + '<span class="tag ' + esc(n.type) + '">' + esc(n.type) + '</span>'
    + '<span class="mono" style="font-size:12px">' + esc(n.value) + '</span>'
    + '<span class="hint">邻域 ' + d.neighborhood_size + ' 个节点</span></h2>'
    + '<div class="body"><div class="split"><div>'
    + '<div class="hint" style="margin-bottom:6px">邻居（' + (d.neighbors||[]).length + '）</div>'
    + '<div class="scroll" style="max-height:300px"><table>'
    + '<thead><tr><th>关系</th><th>节点</th><th class="num">置信度</th></tr></thead><tbody>'
    + nb + '</tbody></table></div></div><div>'
    + '<div class="hint" style="margin-bottom:6px">关联条目（' + (d.entries||[]).length + '）</div>'
    + '<div class="scroll" style="max-height:300px"><table>'
    + '<thead><tr><th>类型</th><th>内容</th></tr></thead><tbody>'
    + en + '</tbody></table></div></div></div>'
    + (Object.keys(meta).length
        ? '<div class="hint" style="margin:12px 0 6px">节点元数据</div>'
          + jpre(meta)
        : "")
    + '</div></div>';
}

LOADERS.proactive = async function(el){
  await ensureSessions();
  const d = await get(withInst("/proactive"));
  const c = d.config || {};
  const rep = d.report || {};
  const cands = d.candidates || [];
  const acts = d.activity || {};
  const actErr = acts.error ? String(acts.error) : "";
  // `ovs` 必须在 actRows 之前定义 —— 渲染活跃度表时要按会话取静默上限，
  // 写成下面（actRows 之后）会踩 const 的 TDZ，页面直接白屏。
  const ovs = (d.overrides instanceof Object && !(d.overrides || {}).error)
    ? (d.overrides || {}) : {};
  const actRows = Object.keys(acts).filter(function(k){ return k !== "error"; })
    .map(function(u){
      const a = acts[u] || {};
      // 静默连发：自最近一条用户消息以来发了几条 / 当前会话的上限。
      // 打满就是它现在闭嘴的原因（群里一直没人说话）—— 直接标出来，
      // 免得用户以为"设置好了不生效"。
      const ovU = ovs[u] || {};
      const smU = (ovU.silent_max != null) ? +ovU.silent_max
                                           : +num(c.silent_max, 2);
      const st = +num(a.silent_streak, 0);
      const stFull = smU > 0 && st >= smU;
      const stCell = smU > 0
        ? '<span class="pill ' + (stFull ? "off" : "on") + '">'
          + st + " / " + smU + (stFull ? "　已暂停" : "") + '</span>'
        : '<span class="hint">不限制</span>';
      return '<tr><td class="mono" style="font-size:11.5px" title="' + esc(u) + '">'
        + '<span class="tag topic" style="font-size:11px;font-family:inherit">'
        + esc(sessLabel(u)) + '</span></td>'
        + '<td class="hint mono" style="font-size:11px">' + esc(a.persona || "—") + '</td>'
        + '<td>' + esc(a.last_user_ts ? ago(a.last_user_ts) : "从未") + '</td>'
        + '<td>' + esc(a.last_proactive_ts ? ago(a.last_proactive_ts) : "从未") + '</td>'
        + '<td style="white-space:nowrap">' + stCell + '</td>'
        + '<td>' + esc(a.failures) + '</td></tr>';
    }).join("");
  const eff = (d.effective instanceof Object) ? d.effective : {};
  const sessOn = Number(eff.sessions_on || 0);
  // 账本里已失真的键（假会话/已删会话）不计入活跃度表，只在总览页清理
  const staleProLen = Array.isArray(d.stale_proactive) ? d.stale_proactive.length : 0;
  // 全局开关只负责**放行**，会话是逐会话 opt-in 的。两种"看着配好了其实不会出话"
  // 的情况必须当场讲清楚，否则用户改半天只会以为功能坏了：
  //   ① 没放行 → 会话开得再多也不出话；② 放行了但一个会话都没开 → 谁都不出话。
  let gateWarn = "";
  if (!eff.global) {
    gateWarn = '<div class="card" style="border-color:rgba(255,200,87,.4)"><h2>未放行'
      + '<span class="hint">「配置」页签里的「启用主动消息」关着 —— 整个功能停，'
      + (sessOn ? '下面那 ' + sessOn + ' 个「开启」的会话也不会出话。'
                : '分会话配置一律不作数。')
      + '要让主动消息跑起来，先去「配置」页签把它打开。</span></h2>'
      + '<div class="body"></div></div>';
  } else if (sessOn === 0) {
    gateWarn = '<div class="card" style="border-color:rgba(255,200,87,.4)"><h2>还没有会话开启'
      + '<span class="hint">全局开关打开只代表**放行**，它不会替任何会话开口 —— '
      + '主动消息是逐会话 opt-in 的。请在下面「分会话配置」的表尾一行选好会话、'
      + '「开关」保持「开启」，再点「添加覆盖」。</span></h2>'
      + '<div class="body"></div></div>';
  }
  // 全局参考值：占位符提示「继承全局时实际会用的值」
  const G = {min: num(c.min_interval, 45), idle: num(c.idle_minutes, 90),
             silent: num(c.silent_max, 2), quiet: c.quiet || ""};
  // 会话级「开关」只有开/关两种：opt-in 下"没设过"和"关掉"效果一样
  // （都不出话），多给一个「继承」只会让人以为继承之后会跟着全局变成开。

    const enEl = trEl.querySelector(".po-en");
    v.enabled = !!(enEl && enEl.value === "1");
    const num = function(cls, key){
      const el = trEl.querySelector(cls);
      if (el && el.value !== "") v[key] = +el.value;
    };
    num(".po-min", "min_interval_min");

    const old = box.querySelector(poRowSel(u));

    const btn = ev.target.closest("button");

      if (btn.classList.contains("po-clear")) {
        const u = tr.getAttribute("data-umo");

        const u = tr.getAttribute("data-umo");
        const values = readPoRow(tr);
        const r = await post("/proactive/override", {umo: u, values: values});

        poUpdateRow(u, r.overrides[u] || {});  // 只重建这一行（服务端归一化值）
      } else if (btn.classList.contains("po-add-btn")) {
        const addTr = btn.closest("tr.po-add");
        const sel = addTr.querySelector(".po-add-sess");
        const u = sel && sel.value;
        if (!u) throw new Error("请先选择要添加的会话");
        // readPoRow 一定带上 enabled（添加行默认「开启」）—— 选会话即可开启
        const values = readPoRow(addTr);

        toast(values.enabled ? ("已开启「" + sessLabel(u) + "」的主动消息")
                             : ("已为「" + sessLabel(u) + "」保存配置（关闭）"));
        poUpdateRow(u, r.overrides[u] || {});  // 只插入/更新这一行
      }
    });
  });
};

/* 分区标题形如「═══ ① 总开关 ═══」；把 schema 项按出现的标题归组。 */
function buildCfgSections(schema, current){
  const sections = [];
  let cur = null;
  Object.keys(schema).forEach(function(k){
    const spec = schema[k] || {};
    const desc = String(spec.description || k);
    const lines = desc.split(/\r?\n/).map(function(x){ return x.trim(); });
    const head = lines[0] || "";
    if (/═══/.test(head)) {
      cur = {title: head.replace(/═+/g, "").trim(), items: []};
      sections.push(cur);
      lines.shift();
    } else if (!cur) {
      cur = {title: "基本设置", items: []};
      sections.push(cur);
    }
    const label = (lines.shift() || k).replace(/^[①②③④⑤⑥⑦⑧⑨⑩]+\s*/, "");
    const hint = lines.join("\n").trim();
    cur.items.push({key: k, spec: spec, label: label, hint: hint});
  });
  function walk(items, cur){
    items.forEach(function(it){
      const cond = it.spec.condition || {};
      const hidden = Object.keys(cond).some(function(ck){
        const want = cond[ck];
        const got = cur[ck];
        return String(got) !== String(want);
      });
      it.hidden = hidden;
    });
  }
  return {sections: sections, applyRecalc: function(cur){
    walk(sections.reduce(function(a, s){ return a.concat(s.items); }, []), cur);
  }};
}

function cfgControl(it, value){
  const spec = it.spec, k = it.key;
  const hidAttr = ' data-cond="' + esc(k) + '"';
  let ctl = "";
  if (spec.type === "bool") {
    ctl = '<input type="checkbox" id="cfg-' + esc(k) + '"'
      + (value ? ' checked' : '') + ' style="width:auto;height:18px;width:18px">';
  } else if (Array.isArray(spec.options)) {
    const opts = spec.options.map(function(o, i){
      const label = (spec.labels && spec.labels[i]) ? spec.labels[i]
        : (Array.isArray(o) ? o[1] : o);
      const ov = Array.isArray(o) ? o[0] : o;
      return '<option value="' + esc(String(ov)) + '"'
        + (String(value) === String(ov) ? ' selected' : '') + '>'
        + esc(String(label)) + '</option>';
    }).join("");
    ctl = '<select id="cfg-' + esc(k) + '">' + opts + '</select>';
  } else if (spec.type === "int" || spec.type === "float") {
    ctl = '<input type="number" id="cfg-' + esc(k) + '" step="'
      + (spec.type === "int" ? "1" : "any") + '"'
      + (spec.min !== undefined ? ' min="' + spec.min + '"' : '')
      + (spec.max !== undefined ? ' max="' + spec.max + '"' : '')
      + ' value="' + esc(value == null ? "" : value) + '">';
  } else if (spec.type === "list") {
    const joined = (Array.isArray(value) ? value : []).join(", ");
    ctl = '<input type="text" id="cfg-' + esc(k) + '" value="' + esc(joined)
      + '" placeholder="逗号分隔，如 10001, 10086">';
  } else if (spec.type === "text") {
    ctl = '<textarea id="cfg-' + esc(k) + '">' + esc(value == null ? "" : value)
      + '</textarea>';
  } else {
    ctl = '<input type="text" id="cfg-' + esc(k) + '" value="'
      + esc(value == null ? "" : value) + '">';
  }
  const condAttr = Object.keys(spec.condition || {}).length
    ? ' data-dep="' + esc(JSON.stringify(spec.condition)) + '"' : "";
  return '<div class="cfg-item" id="wrap_' + esc(k) + '"' + condAttr + hidAttr + '>'
    + '<label class="f"><span>' + esc(it.label)
    + (spec._special ? ' <span class="pill off">' + esc(spec._special) + '</span>' : '')
    + '</span>' + ctl
    + (it.hint ? '<div class="hint" style="margin-top:4px">' + esc(it.hint) + '</div>' : '')
    + '</label></div>';
}

/* 收集渲染好的所有控件值 */
function collectCfgValues(){
  const vals = {};
  document.querySelectorAll("#tab-config .cfg-item").forEach(function(div){
    const k = div.getAttribute("data-cond");
    if (!k) return;
    if (getComputedStyle(div).display === "none") return;   // 隐藏的依赖项不提交
    const el = document.getElementById("cfg-" + k);
    if (!el) return;
    const spec = window.__CFG_SCHEMA__[k] || {};
    if (spec.type === "bool") vals[k] = el.checked;
    else if (spec.type === "int") vals[k] = parseInt(el.value, 10);
    else if (spec.type === "float") vals[k] = parseFloat(el.value);
    else if (spec.type === "list") vals[k] = el.value.split(",")
      .map(function(x){ return x.trim(); }).filter(Boolean);
    else vals[k] = el.value;
  });
  return vals;
}

/* 依赖条件（condition）联动：父开关变化时重算可见性 */
function recalcCfgVisibility(){
  document.querySelectorAll("#tab-config .cfg-item").forEach(function(div){
    const dep = div.getAttribute("data-dep");
    if (!dep) return;
    let cond = {};
    try { cond = JSON.parse(dep); } catch (e) { return; }
    const ok = Object.keys(cond).every(function(ck){
      const el = document.getElementById("cfg-" + ck);
      if (!el) return false;
      return String(cond[ck]) === (el.type === "checkbox" ? String(el.checked) : String(el.value));
    });
    div.style.display = ok ? "" : "none";
  });
}

LOADERS.config = async function(el){
  const wantInst = window.__CFG_INST__ || "";
  const d = await get("/config" + (wantInst ? "?inst=" + encodeURIComponent(wantInst) : ""));
  const instList = d.instances || [];
  const curInst = d.inst || wantInst || "";
  window.__CFG_INST__ = curInst;
  const schema = d.schema || {}, current = d.current || {};
  window.__CFG_SCHEMA__ = schema;
  const built = buildCfgSections(schema, current);
  if (built.sections.length) built.applyRecalc(current);
  const cards = built.sections.map(function(s){
    return '<div class="card"><h2>' + esc(s.title)
      + '<span class="hint">保存后通过 /config/set 落盘并热同步，改动立即生效</span></h2>'
      + '<div class="body">' + s.items.map(function(it){
          return cfgControl(it, current[it.key]);
        }).join("")
      + '</div></div>';
  }).join("");
  el.innerHTML =
    '<div class="card"><h2>插件配置'
    + '<span class="hint">当前编辑的实例：</span>'
    + '<select id="cfgInst" style="min-width:130px">'
    + (instList.length ? instList : [curInst]).map(function(i){
        return '<option value="' + esc(i) + '"' + (i === curInst ? ' selected' : '') + '>'
          + esc(i === "__default__" ? "（默认模板·仅新建实例用）" : i) + '</option>';
      }).join("")
    + '</select>'
    + '<span class="hint">改模板不影响已有实例；改某实例只影响它自己</span>'
    + '<span class="spacer"></span>'
    + '<button class="primary" id="btnCfgSave" title="保存全部可见配置项并立即生效">保存并生效</button>'
    + '</h2><div class="body">'
    + (Object.keys(schema).length
        ? cards
        : '<div class="empty">（未读取到配置 schema）</div>')
    + '</div></div>';
  const instSel = el.querySelector("#cfgInst");
  if (instSel) instSel.addEventListener("change", function(){
    window.__CFG_INST__ = instSel.value;
    LOADERS.config(el).catch(function(err){ toast(err.message, true); });
  });
  // 依赖联动
  el.querySelectorAll('[id^="cfg-"]').forEach(function(inp){
    inp.addEventListener("change", function(){ recalcCfgVisibility(); });
    if (inp.tagName === "INPUT") inp.addEventListener("input", function(){ recalcCfgVisibility(); });
  });
  recalcCfgVisibility();
  el.querySelector("#btnCfgSave").addEventListener("click", function(e){
    busy(e.target, async function(){
      const r = await post("/config/set", {values: collectCfgValues(),
                                           inst: window.__CFG_INST__ || ""});
      const syn = (r.synced || []).join("、");
      toast("已保存" + (r.applied ? " " + r.applied.length + " 项" : "") + "并生效"
        + (syn ? "（热同步：" + syn + "）" : ""));
      LOADERS.config(el).catch(function(err){ toast(err.message, true); });
    });
  });
};

LOADERS["persona-pool"] = async function(el){
  const d0 = await get("/persona-pool");
  const defaults0 = d0.defaults || {};

  function idx(d){ const m={}; (d.personas||[]).forEach(function(p){ m[p.id]=p; }); return m; }
  function q(s){ return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/"/g,'\\"'); }

  function chipHtml(p, inRow, inst, granted){
    const g = granted || [];
    const badge = inRow ? "" : '<span class="tag pp-badge"'
      + (g.length ? ' style="font-size:10px" title="已授权给：' + esc(g.join("、")) + '"'
                  : ' style="display:none;font-size:10px"')
      + '>' + (g.length ? '已授 ' + g.length : '') + '</span>';
    return '<div class="pp-chip" ' + (inRow ? '' : 'draggable="true" data-left="1"')
      + ' data-pid="' + esc(p.id) + '"'
      + (inRow ? ' data-inrow="1" data-inst="' + esc(inst) + '"' : '')
      + ' style="display:inline-flex;align-items:center;gap:6px;padding:4px 8px;margin:3px;'
      + 'border:1px solid rgba(127,127,127,.35);border-radius:6px;background:rgba(127,127,127,.06);'
      + 'cursor:' + (inRow ? 'default' : 'grab') + ';font-size:12px"'
      + ' title="' + esc(p.id) + (p.world ? ' · ' + esc(p.world) : '') + '">'
      + '<span>' + esc(p.display_name) + '</span>'
      + (p.world ? '<span class="hint" style="font-size:10px">' + esc(p.world) + '</span>' : '')
      + badge
      + (inRow ? '<span class="pp-x" data-pid="' + esc(p.id) + '" data-inst="' + esc(inst)
        + '" style="cursor:pointer;opacity:.65;padding:0 2px" title="撤销">×</span>' : '')
      + '</div>';
  }

  function rowHtml(it, byId, defaults){
    const g = (it.grants || []).map(function(pid){
      return byId[pid] || {id: pid, display_name: pid + "（缺失）", world: ""};
    });
    const chips = g.map(function(p){ return chipHtml(p, true, it.id, []); }).join("")
      || '<span class="hint">（空 —— 把左侧人格拖到这里）</span>';
    const cur = (defaults || {})[it.id] || "";
    const sel = '<select data-def="' + esc(it.id) + '" style="min-width:160px">'
      + '<option value=""' + (cur ? '' : ' selected') + '>（未设置）</option>'
      + (it.grants || []).map(function(pid){
          const p = byId[pid];
          return '<option value="' + esc(pid) + '"' + (pid === cur ? ' selected' : '') + '>'
            + esc(p ? p.display_name : pid) + '</option>';
        }).join("")
      + '</select>';
    return '<div class="pp-row" data-inst="' + esc(it.id) + '" style="margin:10px 0;padding:10px;'
      + 'border:1px solid rgba(127,127,127,.35);border-radius:8px;opacity:'
      + (it.enabled === false ? '.55' : '1') + '">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">'
      + '<b style="font-size:13px">' + esc(it.id) + '</b>'
      + '<span class="hint">' + (it.enabled === false ? '已禁用' : '运行中')
      + (it.type ? ' · ' + esc(it.type) : '') + '</span>'
      + '<span class="hint">已授 ' + (it.grants || []).length + ' 个</span>'
      + '<span style="flex:1"></span><span class="hint">默认人格</span>' + sel + '</div>'
      + '<div class="pp-drop" data-inst="' + esc(it.id) + '" style="min-height:46px;padding:4px;'
      + 'border:1px dashed rgba(127,127,127,.45);border-radius:6px">' + chips + '</div></div>';
  }

  const byId0 = idx(d0);
  el.innerHTML = '<div class="card"><h2>人格分配'
    + '<span class="hint">把左侧人格<b>拖</b>到右侧实例的虚线框 = 该实例可以使用这个人格；'
    + '一个人格可以同时授权给多个实例。一个人格都没授的实例将跳过人格注入。</span></h2>'
    + '<div class="body"><div style="display:flex;gap:14px;align-items:flex-start">'
    + '<div style="width:300px;flex:0 0 300px">'
    + '<input id="ppSearch" placeholder="搜索人格名 / id / 世界观" style="width:100%;margin-bottom:6px">'
    + '<div class="scroll" style="max-height:64vh" id="ppLeft">'
    + (d0.personas || []).map(function(p){ return chipHtml(p, false, "", p.granted); }).join("")
    + '</div></div>'
    + '<div style="flex:1;min-width:0"><div class="scroll" style="max-height:64vh" id="ppRight">'
    + (d0.instances || []).map(function(it){ return rowHtml(it, byId0, defaults0); }).join("")
    + '</div></div></div></div></div>';

  function patch(d){
    const byId = idx(d);
    const defs = d.defaults || {};
    (d.personas || []).forEach(function(p){
      const c = el.querySelector('.pp-chip[data-left="1"][data-pid="' + q(p.id) + '"]');
      if (!c) return;
      const b = c.querySelector('.pp-badge');
      if (!b) return;
      const n = (p.granted || []).length;
      if (n) { b.style.display = ""; b.textContent = '已授 ' + n;
               b.title = '已授权给：' + p.granted.join('、'); }
      else { b.style.display = "none"; b.textContent = ""; }
    });
    (d.instances || []).forEach(function(it){
      const r = el.querySelector('.pp-row[data-inst="' + q(it.id) + '"]');
      if (r) r.outerHTML = rowHtml(it, byId, defs);
    });
  }

  async function doPost(url, body){
    try {
      const d = await post(url, body);
      patch(d);
    } catch(err){ toast("失败：" + (err.message || err)); }
  }

  // 一次性委托绑定：行重建后依然有效，不再整页重绘
  if (!el.dataset.ppBound){
    el.dataset.ppBound = "1";
    el.addEventListener("dragstart", function(e){
      const c = e.target.closest && e.target.closest('.pp-chip[draggable="true"]');
      if (!c) return;
      e.dataTransfer.setData("text/plain", c.getAttribute("data-pid"));
      e.dataTransfer.effectAllowed = "copy";
    });
    el.addEventListener("dragover", function(e){
      const z = e.target.closest && e.target.closest(".pp-drop");
      if (z) { e.preventDefault(); z.style.borderColor = "var(--ac,#5af)"; }
    });
    el.addEventListener("dragleave", function(e){
      const z = e.target.closest && e.target.closest(".pp-drop");
      if (z) z.style.borderColor = "";
    });
    el.addEventListener("drop", function(e){
      const z = e.target.closest && e.target.closest(".pp-drop");
      if (!z) return;
      e.preventDefault(); z.style.borderColor = "";
      const pid = e.dataTransfer.getData("text/plain");
      if (pid) doPost("/persona-pool/grant", {inst: z.getAttribute("data-inst"), pid: pid});
    });
    el.addEventListener("click", function(e){
      const x = e.target.closest && e.target.closest(".pp-x");
      if (!x) return;
      doPost("/persona-pool/revoke",
        {inst: x.getAttribute("data-inst"), pid: x.getAttribute("data-pid")});
    });
    el.addEventListener("change", function(e){
      const s = e.target;
      if (!s || !s.matches || !s.matches("select[data-def]")) return;
      doPost("/persona-pool/default",
        {inst: s.getAttribute("data-def"), pid: s.value});
    });
  }

  const s = el.querySelector("#ppSearch");
  if (s) s.addEventListener("input", function(){
    const kw = s.value.trim().toLowerCase();
    el.querySelectorAll("#ppLeft .pp-chip").forEach(function(n){
      const t = (n.textContent || "").toLowerCase() + " " + (n.getAttribute("title") || "").toLowerCase();
      n.style.display = (!kw || t.indexOf(kw) >= 0) ? "" : "none";
    });
  });
};
